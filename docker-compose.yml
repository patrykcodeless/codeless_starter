version: "3.9"

networks:
  proxy: {}

services:
  traefik:
    image: "${TRAEFIK_IMAGE:-traefik:v2.11}"
    profiles: ["traefik"]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./services/traefik/letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"
    restart: unless-stopped
    networks:
      - proxy

  n8n:
    image: "${N8N_IMAGE:-n8nio/n8n}:${N8N_VERSION:-1.72.0}"
    profiles: ["n8n"]
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
    volumes:
      - "./services/n8n/data:/home/node/.n8n"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    restart: unless-stopped
    networks:
      - proxy

  nocodb:
    image: "${NOCODB_IMAGE:-nocodb/nocodb}:${NOCODB_VERSION:-0.204.3}"
    profiles: ["nocodb"]
    environment:
      - NC_PUBLIC_URL=https://${NOCODB_DOMAIN}
    volumes:
      - "./services/nocodb/data:/usr/app/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nocodb.rule=Host(`${NOCODB_DOMAIN}`)"
      - "traefik.http.routers.nocodb.entrypoints=websecure"
      - "traefik.http.routers.nocodb.tls.certresolver=le"
      - "traefik.http.services.nocodb.loadbalancer.server.port=8080"
    restart: unless-stopped
    networks:
      - proxy

  onyx:
    image: "${ONYX_IMAGE:-ghcr.io/onyx-oss/onyx}:${ONYX_VERSION:-latest}"
    profiles: ["onyx"]
    environment:
      - PORT=3000
    volumes:
      - "./services/onyx/data:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onyx.rule=Host(`${ONYX_DOMAIN}`)"
      - "traefik.http.routers.onyx.entrypoints=websecure"
      - "traefik.http.routers.onyx.tls.certresolver=le"
      - "traefik.http.services.onyx.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - proxy

